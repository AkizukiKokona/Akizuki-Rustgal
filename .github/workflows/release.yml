name: Release

# 版本发布流水线（三平台矩阵）。
#
# 触发策略：
#   - 推送 v* tag：全平台并行构建，并在 GitHub Releases 创建发行版
#   - workflow_dispatch：输入 tag 名模拟触发（用于不实际打 tag 也能测试流水线）
#
# 预发行版判定：tag 含 -alpha / -beta / -rc / -pre 时标记为 Pre-release。
# 三平台产物统一上传到同一个 Release。

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "模拟触发的 tag 名（如 v0.1.0-alpha.1）"
        required: true
        type: string

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always

jobs:
  resolve:
    name: Resolve tag
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.t.outputs.tag }}
      version: ${{ steps.t.outputs.version }}
      prerelease: ${{ steps.t.outputs.prerelease }}
    steps:
      - id: t
        shell: bash
        run: |
          if [ -n "${{ inputs.tag }}" ]; then
            TAG="${{ inputs.tag }}"
          else
            TAG="${GITHUB_REF#refs/tags/}"
          fi
          echo "tag=${TAG}" >> "$GITHUB_OUTPUT"
          VERSION="${TAG#v}"
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          if [[ "$VERSION" =~ -(alpha|beta|rc|pre)(\.|$) ]]; then
            echo "prerelease=true" >> "$GITHUB_OUTPUT"
          else
            echo "prerelease=false" >> "$GITHUB_OUTPUT"
          fi

  build:
    name: Build (${{ matrix.platform }})
    needs: resolve
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    strategy:
      fail-fast: false
      matrix:
        include:
          - {platform: windows, os: windows-latest, target: x86_64-pc-windows-gnu}
          - {platform: linux, os: ubuntu-latest, target: x86_64-unknown-linux-gnu}
          - {platform: macos, os: macos-latest, target: x86_64-apple-darwin}

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: "1.92.0"
          targets: ${{ matrix.target }}

      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: cargo-game-${{ matrix.platform }}-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            cargo-game-${{ matrix.platform }}-

      - name: Setup MSYS2 (Windows)
        if: matrix.platform == 'windows'
        uses: msys2/setup-msys2@v2
        with:
          msystem: UCRT64
          update: false
          install: mingw-w64-ucrt-x86_64-gcc
          path-type: inherit

      - name: Install system deps (Linux)
        if: matrix.platform == 'linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libxcb-render-util0-dev libxcb-shape0-dev libxcb-xfixes0-dev libxcb-xkb-dev libasound2-dev

      - name: Patch version into Cargo.toml
        shell: bash
        run: |
          sed -i -E "s/^version = \".*\"/version = \"${{ needs.resolve.outputs.version }}\"/" Cargo.toml
          grep -E "^version" Cargo.toml | head -1

      - name: Build workspace (Windows)
        if: matrix.platform == 'windows'
        shell: msys2 {0}
        env:
          # 仅对 x86_64-pc-windows-gnu 目标生效；其它平台忽略此变量
          CARGO_TARGET_X86_64_PC_WINDOWS_GNU_LINKER: gcc
        run: cargo build --workspace --release --target ${{ matrix.target }}

      - name: Build workspace (Linux/macOS)
        if: matrix.platform != 'windows'
        shell: bash
        run: cargo build --workspace --release --target ${{ matrix.target }}

      - name: Stage package
        shell: bash
        run: |
          STAGE="akrs-game"
          mkdir -p "$STAGE/scripts" "$STAGE/assets/fonts"
          mkdir -p "$STAGE/assets/bg" "$STAGE/assets/characters"
          mkdir -p "$STAGE/assets/music" "$STAGE/assets/sound"
          BIN_DIR="target/${{ matrix.target }}/release"
          if [ "${{ matrix.platform }}" = "windows" ]; then
            cp "$BIN_DIR/akrs.exe" "$STAGE/"
            cp "$BIN_DIR/akrs-game.exe" "$STAGE/"
            cp "$BIN_DIR/akrs-editor.exe" "$STAGE/"
            find "$BIN_DIR/deps" -name "lewton.dll" -exec cp {} "$STAGE/" \; 2>/dev/null || true
            rm -f "$STAGE"/lewton-*.dll
            printf 'cd /d "%%~dp0"\r\nstart akrs-game.exe\r\n' > "$STAGE/启动游戏.bat"
            printf 'cd /d "%%~dp0"\r\nstart akrs-editor.exe\r\n' > "$STAGE/启动编辑器.bat"
          else
            cp "$BIN_DIR/akrs" "$STAGE/"
            cp "$BIN_DIR/akrs-game" "$STAGE/"
            cp "$BIN_DIR/akrs-editor" "$STAGE/"
            printf '#!/bin/bash\ncd "$(dirname "$0")"\n./akrs-game\n' > "$STAGE/启动游戏.sh"
            chmod +x "$STAGE/启动游戏.sh"
            printf '#!/bin/bash\ncd "$(dirname "$0")"\n./akrs-editor\n' > "$STAGE/启动编辑器.sh"
            chmod +x "$STAGE/启动编辑器.sh"
          fi
          cp scripts/demo.akrs "$STAGE/scripts/" 2>/dev/null || true
          cp assets/fonts/SourceHanSansSC-Regular-2.otf "$STAGE/assets/fonts/" 2>/dev/null || true
          cp assets/bg/*.png "$STAGE/assets/bg/" 2>/dev/null || true
          cp assets/characters/*.png "$STAGE/assets/characters/" 2>/dev/null || true
          cp assets/title.png "$STAGE/assets/" 2>/dev/null || true
          mkdir -p "$STAGE/assets/scripts/languages/ui"
          cp assets/scripts/languages/*.json "$STAGE/assets/scripts/languages/" 2>/dev/null || true
          cp assets/scripts/languages/ui/*.json "$STAGE/assets/scripts/languages/ui/" 2>/dev/null || true
          cp LICENSE "$STAGE/" 2>/dev/null || true
          printf 'Akizuki*Rustgal ${{ needs.resolve.outputs.version }} (%s)\n\n游戏:\n  Windows: 双击 启动游戏.bat\n  Linux/macOS: ./启动游戏.sh\n编辑器:\n  Windows: 双击 启动编辑器.bat\n  Linux/macOS: ./启动编辑器.sh\n命令行工具: akrs check scripts/demo.akrs\n' "${{ matrix.platform }}" > "$STAGE/README.txt"

      - name: Archive
        id: archive
        shell: bash
        run: |
          VERSION="${{ needs.resolve.outputs.version }}"
          PLATFORM="${{ matrix.platform }}"
          if [ "$PLATFORM" = "windows" ]; then
            ARTIFACT="akrs-game-${VERSION}-${PLATFORM}.zip"
            7z a -tzip "$ARTIFACT" akrs-game/
          else
            ARTIFACT="akrs-game-${VERSION}-${PLATFORM}.tar.gz"
            tar -czf "$ARTIFACT" akrs-game/
          fi
          echo "artifact=${ARTIFACT}" >> "$GITHUB_OUTPUT"
          ls -lh "$ARTIFACT"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: akrs-game-${{ needs.resolve.outputs.version }}-${{ matrix.platform }}
          path: ${{ steps.archive.outputs.artifact }}
          retention-days: 7

  release:
    name: Create Release
    needs: [resolve, build]
    runs-on: ubuntu-latest
    steps:
      - name: Download all platform artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: List artifacts
        shell: bash
        run: ls -lh artifacts/

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.resolve.outputs.tag }}
          name: ${{ needs.resolve.outputs.tag }}
          prerelease: ${{ needs.resolve.outputs.prerelease }}
          body: |
            ## Akizuki*Rustgal 首个发行版

            纯 Rust 打造的视觉小说引擎 —— 编译时剧本纠错、自定义 DSL、可视化编辑器、蓝图拖拽写剧本,单二进制三平台运行。

            ### 这是什么

            Akizuki*Rustgal 是一个从零开始、100% 纯 Rust 实现的视觉小说引擎。从词法分析、语法解析、类型检查到虚拟机、渲染器、编辑器,每一行代码都是 Rust,不依赖 Python / Lua / TJS 等任何脚本运行时。

            ### 核心亮点

            - **编译时剧本纠错** —— 未定义跳转、重复节名、缺失资源在 `cargo build` 阶段就报错
            - **可视化编辑器** —— egui 驱动,语法高亮 + 立绘/背景/音乐实时预览 + 对照翻译模式
            - **蓝图模式可视化写剧本** —— 类 UE 蓝图的节点编辑,拖拽引脚连线即可组织流程,完整支持触摸屏(双指缩放/单指平移连线/引脚放大),平板也能写剧本
            - **过程宏编译期嵌入** —— `.akrs` 脚本在编译时嵌入 Rust,类型检查延伸到剧本层
            - **满血 Rust 零运行时** —— 无 GC 停顿,单二进制分发,帧率稳定可预测

            ### 包内含什么

            每个平台压缩包内含:**游戏主程序**(akrs-game)+ **可视化编辑器**(akrs-editor)+ **命令行工具**(akrs)+ demo 剧本、字体、立绘、背景、四语言文件、LICENSE、启动脚本。Windows 双击 `.bat`、Linux/macOS 运行 `.sh` 即可。

            ### 关于代码

            本项目代码实现由 AI 负责,但我会对里面的每一行代码负责。

            **许可证**:MIT

            完整功能详见 [README.md](https://github.com/AkizukiKokona/Akizuki-Rustgal/blob/main/README.md)。
          files: artifacts/*
