[workspace]
resolver = "2"
# 任务4：akrs-editor 重新加入 workspace。原排除原因为 eframe 0.21 的 wasm 门控
# 依赖与任务3 引入的 wgpu 22 冲突；现已将 eframe/egui 升级到 0.29（首个使用
# wgpu 22 的版本），wasm 依赖统一到 ^0.4 系列，冲突消除。编辑器沿用 glow
# 后端（eframe 0.29 默认），不额外拉入 wgpu。
members = [
    "crates/akrs-core",
    "crates/akrs-macros",
    "crates/akrs-runtime",
    "crates/akrs-render",
    "crates/akrs-editor",
    "crates/akrs-pack",
    "crates/akrs-cli",
    "crates/akrs-game",
]

[workspace.package]
version = "1.0.63"
edition = "2024"
license = "MIT"
authors = ["Akizuki*Rustgal Team"]
description = "A visual novel engine built in Rust with compile-time DSL checking"
rust-version = "1.92.0"

[workspace.dependencies]
akrs-core = { path = "crates/akrs-core" }
akrs-macros = { path = "crates/akrs-macros" }
akrs-runtime = { path = "crates/akrs-runtime" }
akrs-render = { path = "crates/akrs-render" }
akrs-pack = { path = "crates/akrs-pack" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
codespan-reporting = "0.12"
notify = "6"
notify-debouncer-mini = "0.4"
syn = { version = "2", features = ["full", "extra-traits"] }
quote = "1"
proc-macro2 = { version = "1", features = ["span-locations"] }
proc-macro-error2 = "2"
# macroquad: 旧渲染后端，任务3 迁移到 wgpu 后将移除。当前保留以渐进迁移：
# `default-features = false` 关闭 audio feature（quad-snd → quad-alsa-sys），
# 避免与 kira→cpal→alsa-sys 在 `links = "alsa"` 上冲突。
macroquad = { version = "0.3", default-features = false }
# kira: 音频引擎（cpal backend + symphonia 解码 mp3/ogg/vorbis/flac/wav，纯 Rust）。
kira = "0.12"
# cosmic-text: 文本 shaping/layout/raster（harfrust + swash，纯 Rust）。
cosmic-text = "0.18"
# wgpu: 新渲染后端（任务3），替换 macroquad/miniquad 的 OpenGL 后端。
# `default-features = false` 关闭 webgpu/webgl（拉入 wasm 链）。
# vulkan 后端由 wgpu-core 的 cfg(target_os) 依赖在 Linux/Windows 自动启用，
# 无需也不能作为 user feature 指定；metal/dx12 显式开启。这样 wgpu 在原生
# 桌面不引入 js-sys/web-sys，避免与编辑器 eframe 的 wasm 链冲突。
wgpu = { version = "22", default-features = false, features = ["wgsl", "metal", "dx12"] }
# winit: 窗口与事件系统。`rwh_06` 与 wgpu 22 的 surface 创建兼容。
winit = { version = "0.29", features = ["rwh_06"] }
# image: PNG 解码（同步加载纹理，替换 macroquad 的 async load_texture）。
image = { version = "0.24", default-features = false, features = ["png"] }
# pollster: 同步阻塞 wgpu 异步初始化（request_adapter/request_device）。
# pollster 最新版为 0.4（无 1.x），API `block_on` 跨版本兼容。
pollster = "0.4"
# bytemuck: 顶点数据零拷贝上传（wgpu vertex buffer）。
bytemuck = { version = "1", features = ["derive"] }
# eframe 0.29 是首个使用 wgpu 22 的版本（与 akrs-render 的 wgpu 22 共享同一锁文件
# 条目，无冲突）。编辑器沿用 glow 后端（0.29 默认），不额外拉入 wgpu 依赖。
# `default-features = false` 关闭 `accesskit`（Linux 会拉入 atspi/zbus 无障碍栈，
# 本项目不需要），仅保留 `glow`（渲染）+ `default_fonts`。
eframe = { version = "0.29", default-features = false, features = ["glow", "default_fonts"] }
egui = "0.29"

[patch.crates-io]
macroquad = { path = "patches/macroquad" }

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true
