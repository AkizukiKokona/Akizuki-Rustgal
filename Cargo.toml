[workspace]
resolver = "2"
# 任务5：akrs-editor 重新加入 workspace。编辑器已从 eframe/egui 迁移到 iced 0.13。
# iced 0.13 使用 wgpu 22 + winit 0.29，与 akrs-render 完全共享同一锁文件条目，
# 无冲突。eframe/egui 不再被任何 crate 使用，已从依赖中移除。
members = [
    "crates/akrs-core",
    "crates/akrs-macros",
    "crates/akrs-runtime",
    "crates/akrs-render",
    "crates/akrs-editor",
    "crates/akrs-pack",
    "crates/akrs-cli",
    "crates/akrs-game",
]

[workspace.package]
# patch 段与编辑器关于页 BUILD_NUMBER 保持一致（本轮 0090 → 0091）。
version = "1.0.91"
edition = "2024"
license = "MIT"
authors = ["Akizuki*Rustgal Team"]
description = "A visual novel engine built in Rust with compile-time DSL checking"
rust-version = "1.92.0"

[workspace.dependencies]
akrs-core = { path = "crates/akrs-core" }
akrs-macros = { path = "crates/akrs-macros" }
akrs-runtime = { path = "crates/akrs-runtime" }
akrs-render = { path = "crates/akrs-render" }
akrs-pack = { path = "crates/akrs-pack" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
codespan-reporting = "0.12"
# thiserror：统一错误类型派生（#[derive(Error)] + #[error] + #[from]）。
thiserror = "1"
# log + env_logger：统一日志门面与初始化。env_logger 默认 warn+，
# 设 RUST_LOG=debug 可看调试日志。
log = "0.4"
env_logger = "0.11"
notify = "6"
notify-debouncer-mini = "0.4"
syn = { version = "2", features = ["full", "extra-traits"] }
quote = "1"
proc-macro2 = { version = "1", features = ["span-locations"] }
proc-macro-error2 = "2"
# kira: 音频引擎（cpal backend + symphonia 解码 mp3/ogg/vorbis/flac/wav，纯 Rust）。
kira = "0.12"
# cosmic-text: 文本 shaping/layout/raster（harfrust + swash，纯 Rust）。
cosmic-text = "0.18"
# wgpu: 新渲染后端（任务3），替换 macroquad/miniquad 的 OpenGL 后端。
# `default-features = false` 关闭 webgpu/webgl（拉入 wasm 链）。
# vulkan 后端由 wgpu-core 的 cfg(target_os) 依赖在 Linux/Windows 自动启用，
# 无需也不能作为 user feature 指定；metal/dx12 显式开启。这样 wgpu 在原生
# 桌面不引入 js-sys/web-sys，避免与编辑器 eframe 的 wasm 链冲突。
wgpu = { version = "22", default-features = false, features = ["wgsl", "metal", "dx12"] }
# winit: 窗口与事件系统。`rwh_06` 与 wgpu 22 的 surface 创建兼容。
winit = { version = "0.29", features = ["rwh_06"] }
# image: PNG 解码（同步加载纹理，替换 macroquad 的 async load_texture）。
image = { version = "0.25", default-features = false, features = ["png"] }
# pollster: 同步阻塞 wgpu 异步初始化（request_adapter/request_device）。
# pollster 最新版为 0.4（无 1.x），API `block_on` 跨版本兼容。
pollster = "0.4"
# bytemuck: 顶点数据零拷贝上传（wgpu vertex buffer）。
bytemuck = { version = "1", features = ["derive"] }
# iced 0.13：编辑器 GUI 框架（替换 main 分支的 eframe/egui）。受 Elm 启发的
# 跨平台 GUI 库，Elm 架构（State + Message + update + view）。iced 0.13 使用
# wgpu 22 + winit 0.29，与 akrs-render 共享同一锁文件条目，无冲突。
iced = "0.13"
# rfd：原生文件对话框（打开/保存/选目录）。跨平台（Windows/macOS/Linux）。
# Linux 默认用 xdg-portal（需要 libdbus），避免 GTK3 编译依赖。
# 替代 main 分支自实现的文件浏览器，彻底避免"读不了文件"类 bug。
rfd = "0.15"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true
