[package]
name = "akrs-render"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
akrs-core = { workspace = true }
akrs-runtime = { workspace = true }
# 渲染后端（任务3）：wgpu + winit + 图像解码 + 顶点零拷贝 + 同步阻塞。
wgpu = { workspace = true }
winit = { workspace = true }
image = { workspace = true }
pollster = { workspace = true }
bytemuck = { workspace = true }
# 音频后端（任务1 内置重做）：kira（cpal + symphonia）。
kira = { workspace = true }
# 文本后端（任务2 内置重做）：cosmic-text（harfbuzz + swash）。
cosmic-text = { workspace = true }
# 旧渲染后端：保留以渐进迁移。`default-features = false` 关闭 audio
# （quad-snd → quad-alsa-sys）避免与 kira→cpal→alsa-sys 在 `links="alsa"` 冲突。
# 任务3 完成后此依赖将被移除。
macroquad = { workspace = true }

# Windows 平台专用：用于真实显示器尺寸检测、窗口居中、控制台分配。
# 仅在编译 Windows 目标时引入，其他平台无此依赖。
[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.52", features = [
    "Win32_Foundation",
    "Win32_UI_WindowsAndMessaging",
    "Win32_Graphics_Gdi",
    "Win32_System_Console",
] }
